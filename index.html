  <body>
    <!--
      THESIS: a cadmium eclipse field with no identity, not a resume or hello page.
      OWN-WORLD: ink black, bone, one cadmium accent, ring + blades + shader.
      STORY: visitor only feels material and motion.
      FIRST VIEWPORT: full-bleed field, a thin ring, no words.
      FORM: pinned scroll machine. seed: visual-only.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <h1 class="sr-only">A visual field.</h1>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="36" />
      </svg>
      <div class="core" aria-hidden="true"></div>
      <div class="blades" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
